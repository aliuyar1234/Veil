version: "1.0"
name: "GDPR Standard"
locale: de-at

detection:
  - types: [email, phone, iban, credit_card]
    confidence_threshold: 0.8
    enabled: true

protection:
  - types: [email]
    action: redact
    style: label

  - types: [phone]
    action: redact
    style: label

  - types: [iban, credit_card]
    action: mask
