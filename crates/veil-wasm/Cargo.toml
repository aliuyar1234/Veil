[package]
name = "veil-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for Veil PII detection and protection"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Workspace crates
veil-parsers = { path = "../veil-parsers" }
veil-detect = { path = "../veil-detect" }
veil-redact = { path = "../veil-redact" }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true

# WASM bindings
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys.workspace = true
serde-wasm-bindgen.workspace = true

# WASM-compatible time
web-time = "1.1"

# WASM random support (needed for transitive dependencies)
getrandom.workspace = true

[dev-dependencies]
wasm-bindgen-test = "0.3.40"

# Note: Profile settings are in workspace root Cargo.toml
# to avoid "profiles for non root package will be ignored" warning

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
