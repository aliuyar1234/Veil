[package]
name = "veil-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for PII detection and redaction"
keywords = ["pii", "privacy", "cli", "gdpr"]
categories = ["command-line-utilities"]

[[bin]]
name = "veil"
path = "src/main.rs"

[dependencies]
veil-parsers = { path = "../veil-parsers", version = "0.1.0" }
veil-detect = { path = "../veil-detect", version = "0.1.0" }
veil-redact = { path = "../veil-redact", version = "0.1.0" }
veil-policy = { path = "../veil-policy", version = "0.1.0" }
veil-audit = { path = "../veil-audit", version = "0.1.0" }
veil-office = { path = "../veil-office", version = "0.1.0" }
veil-email = { path = "../veil-email", version = "0.1.0" }
veil-batch = { path = "../veil-batch", version = "0.1.0" }
veil-discovery = { path = "../veil-discovery", version = "0.1.0" }
veil-stream = { path = "../veil-stream", version = "0.1.0" }
veil-crypto = { path = "../veil-crypto", version = "0.1.0" }
veil-core = { path = "../veil-core", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
thiserror.workspace = true
miette.workspace = true
clap.workspace = true
rand.workspace = true
base64.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
assert_cmd = "2.0"
predicates = "3.1"
