[package]
name = "veil-core"
version = "0.1.0"
edition = "2021"
description = "Core types for Veil PII detection toolkit"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/veil"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.5"

[dev-dependencies]
serde_json = "1.0"
proptest = "1.4"
