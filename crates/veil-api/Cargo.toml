[package]
name = "veil-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "REST API server for the Veil privacy platform"
keywords = ["api", "rest", "privacy", "pii", "redaction"]
categories = ["web-programming::http-server"]

[[bin]]
name = "veil-server"
path = "src/main.rs"

[lib]
name = "veil_api"
path = "src/lib.rs"

[dependencies]
# Web framework
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
http = "1.1"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Auth
jsonwebtoken = { workspace = true }

# Utilities
bytes = { workspace = true }
mime = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Config
toml = { workspace = true }

# Veil crates
veil-parsers = { path = "../veil-parsers" }
veil-detect = { path = "../veil-detect" }
veil-redact = { path = "../veil-redact" }
veil-policy = { path = "../veil-policy" }
veil-audit = { path = "../veil-audit" }

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio-test = "0.4"

[features]
default = []
