[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/veil"
authors = ["Veil Contributors"]
rust-version = "1.75"
readme = "README.md"
homepage = "https://github.com/your-org/veil"
documentation = "https://docs.rs/veil"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
thiserror = "1.0"
miette = { version = "7.0", features = ["fancy"] }

# Format-specific parsing
csv = "1.3"
encoding_rs = "0.8"
scraper = "0.18"
pdf-extract = "0.7"
pdf = "0.9"
lopdf = "0.34"

# Detection
regex = "1.10"
once_cell = "1.19"

# Dictionary detection
fst = "0.4"
strsim = "0.11"
unicode-segmentation = "1.11"
unicode-normalization = "0.1"

# CLI
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
console = "0.15"

# Audit
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Cryptography
aes-gcm = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.5"
fake = { version = "2.9", features = ["derive"] }

# Testing
pretty_assertions = "1.4"
tempfile = "3.10"

# TTY detection
atty = "0.2"

# Batch processing
walkdir = "2.5"
glob = "0.3"
infer = "0.16"
rayon = "1.8"

# Office document parsing
calamine = "0.24"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
quick-xml = "0.31"

# Email parsing
mailparse = "0.15"
html2text = "0.12"

# WASM
wasm-bindgen = "0.2.90"
wasm-bindgen-futures = "0.4.40"
js-sys = "0.3.68"
web-sys = { version = "0.3.68", features = ["console"] }
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.3", features = ["wasm_js"] }

# API Server
axum = { version = "0.7", features = ["multipart", "tokio"] }
tokio = { version = "1.35", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "util"] }
jsonwebtoken = "9.3"
hyper = { version = "1.0", features = ["full"] }
bytes = "1.5"
mime = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"

# Optimized release profile for WASM builds
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

# WASM-specific: strip debug symbols for smaller size
[profile.release.package.veil-wasm]
strip = true
