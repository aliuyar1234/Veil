name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@4e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@be9e76fd7c4901c61fb841f559994984270fce7
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@4e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@be9e76fd7c4901c61fb841f559994984270fce7
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

  wasm:
    name: WASM Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@4e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@be9e76fd7c4901c61fb841f559994984270fce7
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Cache cargo registry
        uses: actions/cache@057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Build WASM
        run: wasm-pack build crates/veil-wasm --target web

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@4e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@be9e76fd7c4901c61fb841f559994984270fce7

      - name: Cache cargo registry
        uses: actions/cache@057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-

      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@4e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.0 --locked

      - name: Run security audit
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.18.9 --locked

      - name: Run cargo-deny
        run: cargo deny check

      - name: Install detect-secrets
        run: python -m pip install detect-secrets==1.4.0

      - name: Secret scan (detect-secrets)
        run: python -m detect_secrets.pre_commit_hook --baseline .secrets.baseline --exclude-files 'Cargo\\.lock|\\.secrets\\.baseline' $(git ls-files)

  coverage:
    name: Code Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@4e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@be9e76fd7c4901c61fb841f559994984270fce7
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9fef977cc78d9c6fecc249b5ee8f282a3a603584

      - name: Cache cargo registry
        uses: actions/cache@057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cov-

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Check coverage threshold (90%)
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          out = subprocess.check_output(
              ["cargo", "llvm-cov", "--workspace", "--all-features", "--json"],
              text=True,
          )
          data = json.loads(out)
          coverage = float(data["data"][0]["totals"]["lines"]["percent"])
          print(f"Coverage: {coverage:.2f}%")
          if coverage < 90:
              print(f"::warning::Coverage is below 90% threshold: {coverage:.2f}%")
          PY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: lcov.info
          fail_ci_if_error: false

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-24.04
    # Only run on main branch to save CI time
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@4e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@be9e76fd7c4901c61fb841f559994984270fce7

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 26.0.0 --locked

      - name: Cache cargo registry
        uses: actions/cache@057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutants-

      - name: Run mutation testing
        run: |
          cargo mutants --workspace --timeout 300 -- --all-features 2>&1 | tee mutants.log
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path("mutants.log").read_text(encoding="utf-8", errors="replace")
          match = re.search(
              r"mutation score:\\s*([0-9]+(?:\\.[0-9]+)?)",
              text,
              flags=re.IGNORECASE,
          )
          score = float(match.group(1)) if match else 0.0
          print(f"Mutation score: {score:.2f}%")
          if score < 80:
              print(f"::warning::Mutation score is below 80% threshold: {score:.2f}%")
          PY
