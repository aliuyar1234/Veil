name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          components: clippy

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

  publish:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-24.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9

      - name: Publish crates (dependency order)
        shell: bash
        run: |
          set -euo pipefail

          publish() {
            local crate="$1"
            local attempts=30
            local delay=10

            for i in $(seq 1 "$attempts"); do
              echo "Publishing ${crate} (attempt ${i}/${attempts})"
              set +e
              out="$(cargo publish -p "${crate}" --locked 2>&1)"
              status=$?
              set -e

              echo "${out}"

              if [ "${status}" -eq 0 ]; then
                return 0
              fi

              # Make the workflow re-runnable (e.g., if the job is retried).
              if echo "${out}" | grep -qiE "already uploaded|already exists|409 Conflict"; then
                echo "Crate ${crate} is already published; continuing."
                return 0
              fi

              echo "Publish failed for ${crate}; retrying in ${delay}s..."
              sleep "${delay}"
            done

            echo "Failed to publish ${crate} after ${attempts} attempts" >&2
            return 1
          }

          publish veil-core
          publish veil-types
          publish veil-fs
          publish veil-parsers
          publish veil-detect
          publish veil-redact
          publish veil-crypto
          publish veil-policy
          publish veil-audit
          publish veil-discovery
          publish veil-office
          publish veil-email
          publish veil-stream
          publish veil-batch
          publish veil-cli
          publish veil-wasm

  sbom:
    name: Generate SBOM
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9

      - name: Install cargo-sbom
        run: cargo install cargo-sbom --version 0.10.0 --locked

      - name: Generate SBOM (CycloneDX format)
        run: cargo sbom --output-format cyclonedx_json > sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: sbom.json

  github-release:
    name: Create GitHub Release
    needs: [validate, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sbom

      - name: Create Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          files: sbom.json
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
