name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@4e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@be9e76fd7c4901c61fb841f559994984270fce7
        with:
          components: clippy

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

  publish:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-24.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@4e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@be9e76fd7c4901c61fb841f559994984270fce7

      # Publish in dependency order
      - name: Publish veil-core
        run: cargo publish -p veil-core --locked

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish veil-parsers
        run: cargo publish -p veil-parsers --locked

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish veil-detect
        run: cargo publish -p veil-detect --locked

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish veil-redact
        run: cargo publish -p veil-redact --locked

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish veil-crypto
        run: cargo publish -p veil-crypto --locked

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish veil-policy
        run: cargo publish -p veil-policy --locked

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish veil-audit
        run: cargo publish -p veil-audit --locked

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish veil-discovery
        run: cargo publish -p veil-discovery --locked

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish veil-office
        run: cargo publish -p veil-office --locked

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish veil-email
        run: cargo publish -p veil-email --locked

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish veil-stream
        run: cargo publish -p veil-stream --locked

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish veil-batch
        run: cargo publish -p veil-batch --locked

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish veil-cli
        run: cargo publish -p veil-cli --locked

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish veil-wasm
        run: cargo publish -p veil-wasm --locked

  sbom:
    name: Generate SBOM
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@4e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@be9e76fd7c4901c61fb841f559994984270fce7

      - name: Install cargo-sbom
        run: cargo install cargo-sbom --version 0.10.0 --locked

      - name: Generate SBOM (CycloneDX format)
        run: cargo sbom --output-format cyclonedx_json > sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@a165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: sbom.json

  github-release:
    name: Create GitHub Release
    needs: [validate, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@4e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sbom

      - name: Create Release
        uses: softprops/action-gh-release@6994186c0ac3ef5cae75ac16aa32e8153525f77
        with:
          files: sbom.json
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
