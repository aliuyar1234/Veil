[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = [
  { allow = ["MPL-2.0"], crate = "selectors" },
  { allow = ["MPL-2.0"], crate = "cssparser" },
  { allow = ["MPL-2.0"], crate = "cssparser-macros" },
  { allow = ["MPL-2.0"], crate = "dtoa-short" },
]

[advisories]
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
skip = [
  { crate = "getrandom", reason = "Unavoidable split: rand_core depends on getrandom 0.2 while uuid/tempfile depend on getrandom 0.3" },
  { crate = "thiserror", reason = "Dependency split: msg_parser uses thiserror 1.x while most of the ecosystem has moved to thiserror 2.x" },
  { crate = "thiserror-impl", reason = "Dependency split: msg_parser uses thiserror 1.x while most of the ecosystem has moved to thiserror 2.x" },
  { crate = "unicode-width", reason = "Dependency split: miette/textwrap requires unicode-width 0.1 while scraper/getopts pulls unicode-width 0.2" },
  { crate = "html5ever", reason = "Unavoidable split: scraper depends on html5ever 0.36.x while html2text depends on html5ever 0.37.x" },
  { crate = "markup5ever", reason = "Unavoidable split: scraper depends on markup5ever 0.36.x while html2text depends on markup5ever 0.37.x" },
  { crate = "tendril", reason = "Unavoidable split: scraper depends on tendril 0.4.x while html2text depends on tendril 0.5.x" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
